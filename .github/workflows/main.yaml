name: Terraform-deployment
on: 
    [ push, workflow_dispatch ]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Print Greeting
        run: |
          echo "Hello and welcome! 👋"
          echo "ram"
      - name: Print Greeting 2
        run: echo "Hello and welcome! -2"
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Print message
        run: |
          echo "I am a good person"
          echo "CHAPRI"
  
  wishing-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ✅ Checkout your repo first
      - name: re-useable workflow
        uses: ./.github/actions/mesg
        with:
          who-to-greet: "Siva"

  wishes:
    uses: Mr-siva/github-actions-root/.github/workflows/reuseable.yaml@main
    with:
      env_name: prod
    

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region ap-south-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        working-directory: ./terraform  # <-- make sure this path exists